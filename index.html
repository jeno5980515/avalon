<!DOCTYPE html>
<html>
<head>
<title>Avalon</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.socket.io/socket.io-1.4.3.js"></script>
<link rel="stylesheet" href="css/w3.css"/>
<link rel="stylesheet" href="http://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.4.0/css/font-awesome.min.css">
<link rel="stylesheet" href="css/multiselect.css" />
<link rel="stylesheet" href="css/avalon.css" />
<script type="text/javascript" src="js/multiselect.js"></script>
<script src="js/canvasAutoResizer.js"></script>
</head>
<body>
	<div id="loginPage" class="page">
		<div class="login-container">
			<h2>登入遊戲</h2>
			
			<div class="login-section">
				<label>顯示名稱</label>
				<div class="input-group">
					<input placeholder="輸入你的暱稱" id="nameInput" />
					<button id="loginButton" class="btn">確認</button>
				</div>
			</div>

			<div class="login-section">
				<label>個人圖片</label>
				<div class="input-group">
					<input placeholder="輸入圖片網址" id="imageInput" />
					<button id="loginImageButton" class="btn">確認</button>
				</div>
			</div>

			<!-- Commented section preserved
			<div class="login-section">
				<label>上傳一張圖片</label>
				<input type="file" id="uploadImage" />
			</div>
			-->

			<div class="recovery-section">
				<p class="warning-text">若遊戲斷線，可直接按回覆紀錄回到房間！</p>
				<button id="recoverButton" class="btn btn-recovery">回復紀錄</button>
			</div>

			<a href="https://rawgit.com/jeno5980515/avalon/master/tutorial.html#/" 
			   target="_blank" 
			   class="tutorial-link">
				遊戲系統介紹！
			</a>

			<div id="noticeDiv"></div>
		</div>
	</div>	
	<div id="roomPage" class="page">
		<div class="room-layout">
			<div class="room-actions-container">
				<!-- Create Room Section -->
				<div class="room-section">
					<div class="section-header">
						<i class="fa fa-plus-circle"></i>
						<h2>創建房間</h2>
					</div>
					<div class="room-form">
						<div class="input-group">
							<label for="passwordCreate">
								<i class="fa fa-lock"></i>
								密碼
							</label>
							<input id="passwordCreate" placeholder="若無則留空" />
						</div>
						<button id="createButton" class="btn btn-create">
							<i class="fa fa-plus"></i>
							創建房間
						</button>
					</div>
				</div>

				<!-- Join Room Section -->
				<div class="room-section">
					<div class="section-header">
						<i class="fa fa-sign-in"></i>
						<h2>加入房間</h2>
					</div>
					<div class="room-form">
						<div class="input-group">
							<label for="roomInput">
								<i class="fa fa-home"></i>
								房號
							</label>
							<input id="roomInput" placeholder="輸入房號" />
						</div>
						<div class="input-group">
							<label for="passwordJoin">
								<i class="fa fa-lock"></i>
								密碼
							</label>
							<input id="passwordJoin" placeholder="若無則留空" type="password" />
						</div>
						<button id="joinButton" class="btn btn-join">
							<i class="fa fa-sign-in"></i>
							進入房間
						</button>
					</div>
				</div>
			</div>

			<div class="room-list-container">
				<div class="room-section room-list-section">
					<div class="room-header">
						<div class="section-header">
							<i class="fa fa-list"></i>
							<h2>房間大廳</h2>
						</div>
						<div class="room-filter">
							<label class="checkbox-container">
								<input type="checkbox" id="roomPlayingDisplayBox">
								<span class="checkbox-text">
									<i class="fa fa-filter"></i>
									只顯示可進入的房間
								</span>
							</label>
						</div>
					</div>
					<div id="roomDisplayDiv" class="room-list"></div>
				</div>
			</div>
		</div>
	</div>
	<div id="gamePage" class="page">
		<div class="game-header-wrapper">
			<header class="game-header">
				<div class="header-content">
					<div class="header-left">
						<div id="numberDiv" class="room-number">
							<span class="room-label">房間</span>
							<span class="room-id">#1234</span>
						</div>
						<div class="room-status">
							<span class="status-dot"></span>
							進行中
						</div>
					</div>
					<div class="header-right">
						<div id="restartArea" class="restart-options"></div>
						<button id="restartButton" class="header-btn btn-restart">
							<i class="fa fa-power-off"></i>
							<span>中斷遊戲</span>
						</button>
					</div>
				</div>
			</header>
		</div>
		<div class="game-content">
			<div class="game-layout">
				<div id="roleDiv" class="role-section">
					<!-- Roles will be dynamically inserted here -->
				</div>
				<div id="boardDiv" class="board-section"></div>
			</div>
		</div>
		<div id="playerDiv" class="player-list"></div>
		<div id="eventArea" class="event-container">
			<div id="chooseUserArea" class="event-section"></div>
			<div id="chooseVoteArea" class="event-section"></div>
			<div id="missionArea" class="event-section"></div>
			<div id="godArea" class="event-section"></div>
			<div id="noticeArea" class="event-section"></div>
			<div id="assArea" class="event-section"></div>
			<div id="restartArea" class="event-section"></div>
		</div>
		<footer class="game-footer" id="wordArea">
			<div id="consoleArea" class="console-section"></div>
			<div class="chat-section">
				<div id="textArea" class="chat-messages"></div>
				<div id="textInputArea" class="chat-input">
					<input placeholder="輸入你的訊息" id="textInput">
					<button id="textButton" class="header-btn btn-send">送出</button>
				</div>
			</div>
		</footer>
	</div>
	<script src="js/client.js">
</script>
</body>
</html>
